worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Explicit browser origins. LAN origins must also be added to the backend config.
    map $http_origin $rdk_origin_allowed {
        default 0;
        "http://192.168.1.59:8088" 1;
        "http://192.168.127.10:8088" 1;
        "http://localhost:8088" 1;
        "http://127.0.0.1:8088" 1;
    }
    server {
        listen 0.0.0.0:8088 default_server;
        server_name localhost 127.0.0.1 192.168.1.59 192.168.127.10;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Cache-Control no-store always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        client_max_body_size 1k;
        location = /healthz { return 200 'ok'; }
        location /api/ {
            proxy_pass http://127.0.0.1:8089;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
        }
        location = /ws/v1/telemetry {
            if ($rdk_origin_allowed = 0) { return 403; }
            proxy_pass http://127.0.0.1:8089;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 75s;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
