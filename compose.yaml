name: rdk-control-center
services:
  dashboard:
    image: rdk-control-center-dashboard:0.1.3
    build:
      context: ./frontend
    network_mode: host
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    volumes:
      - ${RDK_NGINX_CONFIG:-./frontend/nginx.conf}:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    mem_limit: 96m
    pids_limit: 64
    # CPU quota is added only by the explicit compatibility generator.
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8088/healthz]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
